# HTTP example for initial EC2 verification. Configure TLS before real use.
# Install in your distribution's Nginx include directory, remove conflicting
# default server configuration, and run nginx -t before reloading.
server {
    listen 80;
    server_name _;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
